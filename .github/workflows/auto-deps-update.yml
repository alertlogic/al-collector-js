name: Dependency Update

on:
  pull_request:
    branches: [npm]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-update-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update dependencies & bump version (Node ${{ matrix.node-version }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref || '', 'chore/dependency-update-'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'npm' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Update dependencies
        run: |
          npm update
          npm audit fix --audit-level=high || true

      - name: Update npm overrides
        run: |
          npm run update:overrides

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check for changes
        if: success()
        id: changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: success() && steps.changes.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Read new version
        if: success() && steps.changes.outputs.changed == 'true'
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check for existing update PR
        if: success() && steps.changes.outputs.changed == 'true'
        id: existing_pr
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = `${context.repo.owner}:chore/dependency-update-${process.env.VERSION}`;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'npm',
              head
            });
            core.setOutput('exists', data.length > 0 ? 'true' : 'false');

      - name: Create Pull Request
        if: success() && steps.changes.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/dependency-update-${{ steps.version.outputs.value }}
          base: npm
          title: "chore: dependency updates -> v${{ steps.version.outputs.value }}"
          body: |
            ## Dependency Updates

            This PR was automatically generated by the Dependency Update workflow.

            ### Changes
            - Updated npm dependencies within declared semver ranges
            - Applied npm audit fix for high/critical vulnerabilities
            - Updated npm overrides when newer pinned override versions were available
            - Bumped package version to v${{ steps.version.outputs.value }}

            ### Checklist
            - [x] Tests pass
            - [x] Lint passes
            - [ ] Review diff in package.json / package-lock.json
          commit-message: "chore: update dependencies and bump to v${{ steps.version.outputs.value }}"
          labels: dependencies,automated
          delete-branch: false
