name: Dependency & Override Updates PR

on:
  schedule:
    # Twice weekly: Monday and Thursday at 09:00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: override-updates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-overrides:
    name: Update dependencies & overrides (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: workflow-test-base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Update dependencies
        run: |
          npm update
          npm audit fix --audit-level=high || true

      - name: Update npm overrides
        run: |
          npm run update:overrides

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check for changes
        if: success()
        id: changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: success() && steps.changes.outputs.changed == 'true'
        run: npm version patch --no-git-tag-version

      - name: Read new version
        if: success() && steps.changes.outputs.changed == 'true'
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check for existing update PR
        if: success() && steps.changes.outputs.changed == 'true'
        id: existing_pr
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = `${context.repo.owner}:chore/dependency-update-${process.env.VERSION}`;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'workflow-test-base',
              head
            });
            core.setOutput('exists', data.length > 0 ? 'true' : 'false');

      - name: Create Pull Request
        if: success() && steps.changes.outputs.changed == 'true' && steps.existing_pr.outputs.exists != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/dependency-update-${{ steps.version.outputs.value }}
          base: workflow-test-base
          title: "chore: dependency updates and npm overrides -> v${{ steps.version.outputs.value }}"
          body: |
            ## Dependency & Override Updates

            This PR was automatically generated by the Dependency & Override Updates workflow.

            ### Changes
            - Updated npm dependencies within declared semver ranges
            - Applied npm audit fix for high/critical vulnerabilities
            - Updated npm overrides to resolve vulnerabilities and latest compatible versions
            - Bumped package version to v${{ steps.version.outputs.value }}

            ### Checklist
            - [x] Tests pass
            - [x] Lint passes
            - [ ] Review diff in package.json / package-lock.json
          commit-message: "chore: update dependencies, overrides, and bump to v${{ steps.version.outputs.value }}"
          labels: dependencies,automated
          delete-branch: false
